<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Plate Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="container">
        <header>
            <h1>License Plate Detection</h1>
            <p>Upload a vehicle image to automatically detect and highlight license plates using YOLOv5 AI.</p>
        </header>

        <main>
            <div class="upload-section" id="drop-area">
                <input type="file" id="file-input" accept="image/*" hidden>
                <div class="upload-content">
                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p>Drag & Drop an image here or</p>
                    <button class="btn" id="browse-btn">Browse Files</button>
                </div>
            </div>

            <div class="result-section hidden" id="result-area">
                <div class="image-wrapper" id="image-wrapper">
                    <img id="preview-image" src="" alt="Uploaded image">
                    <!-- Canvas for drawing bounding boxes -->
                    <canvas id="canvas"></canvas>
                </div>
                
                <div class="controls">
                    <button class="btn outline" id="reset-btn">Upload Another Image</button>
                </div>
                
                <div id="loading" class="hidden">
                    <div class="spinner"></div>
                    <p>Detecting license plates...</p>
                </div>
                
                <div id="status-message"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
